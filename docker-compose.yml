version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: marketnest-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketnest_db
      MYSQL_USER: marketnest
      MYSQL_PASSWORD: marketnest_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:

